name: Smoke test Supabase Edge Functions

on:
  push:
    branches:
      - feat/neon-api-2026-10-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-health:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: btv
            url: https://cmjtxlevjnwugeyttexa.supabase.co/functions/v1/track-orders-api
            apikey: sb_publishable_JPGJOa51xwNAm7Dk55F3Iw_IcNhhdxw
          - channel: rtv
            url: https://fmwagmqysszshcvaddwo.supabase.co/functions/v1/track-orders-api
            apikey: sb_publishable_ft2uIm5ltqrbPGD2ROCzdw_crjiE9Ke
    steps:
      - name: Check health and schema
        env:
          API_URL: ${{ matrix.url }}
          API_KEY: ${{ matrix.apikey }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ["API_URL"].rstrip("/") + "/healthz"
          channel = os.environ["CHANNEL"]
          req = urllib.request.Request(
              url,
              headers={"apikey": os.environ["API_KEY"], "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  code = response.status
                  data = json.loads(response.read().decode("utf-8", "replace"))
          except urllib.error.HTTPError as exc:
              code = exc.code
              try:
                  data = json.loads(exc.read().decode("utf-8", "replace"))
              except Exception:
                  data = {}
          except Exception as exc:
              print(f"{channel}: connection failed: {exc}")
              sys.exit(1)

          print(f"{channel} HTTP: {code}")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          required = {
              "ok": True,
              "databaseConnected": True,
              "schemaReady": True,
              "rateLimitSaltConfigured": True,
              "authConfigured": True,
              "channelConfigured": True,
              "channel": channel,
          }
          mismatches = {k: {"expected": v, "actual": data.get(k)} for k, v in required.items() if data.get(k) != v}
          if code != 200 or mismatches:
              print("Health check failed:", json.dumps(mismatches, ensure_ascii=False))
              sys.exit(1)
          print(f"{channel}: HEALTH PASS")
          PY
  musicbrainz-search:
    runs-on: ubuntu-latest
    needs: edge-health
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: btv
            url: https://cmjtxlevjnwugeyttexa.supabase.co/functions/v1/track-orders-api
            apikey: sb_publishable_JPGJOa51xwNAm7Dk55F3Iw_IcNhhdxw
            origin: https://btvrestored.ru
          - channel: rtv
            url: https://fmwagmqysszshcvaddwo.supabase.co/functions/v1/track-orders-api
            apikey: sb_publishable_ft2uIm5ltqrbPGD2ROCzdw_crjiE9Ke
            origin: https://rtvrestored.ru
    steps:
      - name: Search MusicBrainz without submitting a request
        env:
          API_URL: ${{ matrix.url }}
          API_KEY: ${{ matrix.apikey }}
          ORIGIN: ${{ matrix.origin }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          body = json.dumps({
              "provider": "musicbrainz",
              "artist": "Daft Punk",
              "trackTitle": ""
          }).encode()
          req = urllib.request.Request(
              os.environ["API_URL"].rstrip("/") + "/api/catalog/search",
              data=body,
              method="POST",
              headers={
                  "apikey": os.environ["API_KEY"],
                  "Origin": os.environ["ORIGIN"],
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  code = response.status
                  data = json.loads(response.read().decode("utf-8", "replace"))
          except urllib.error.HTTPError as exc:
              code = exc.code
              try:
                  data = json.loads(exc.read().decode("utf-8", "replace"))
              except Exception:
                  data = {}
          except Exception as exc:
              print(f"{os.environ['CHANNEL']}: request failed: {exc}")
              sys.exit(1)

          results = data.get("results")
          print(f"{os.environ['CHANNEL']} catalog HTTP: {code}")
          print(f"ok={data.get('ok')}, provider={data.get('provider')}, result_count={len(results) if isinstance(results, list) else 'invalid'}")
          if code != 200 or data.get("ok") is not True or not isinstance(results, list) or len(results) == 0:
              print("Catalog error:", data.get("error", "no result"))
              sys.exit(1)
          print(f"{os.environ['CHANNEL']}: MUSICBRAINZ PASS")
          PY
