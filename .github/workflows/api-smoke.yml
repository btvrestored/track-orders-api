name: Smoke test deployed track orders API

on:
  push:
    branches:
      - feat/neon-api-2026-10-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check API readiness and MusicBrainz search
        env:
          API_BASE: https://track-orders-api.bmpr.deno.net
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["API_BASE"].rstrip("/")

          def request(url, data=None, origin=None):
              headers = {"Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              if origin:
                  headers["Origin"] = origin
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers=headers,
                  method="POST" if data is not None else "GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read().decode("utf-8", "replace")
                      return response.status, json.loads(raw)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw": raw[:500]}
                  return error.code, body

          code, health = request(base + "/healthz")
          print("HEALTH_STATUS:", code)
          print("HEALTH:", json.dumps(health, ensure_ascii=False))
          assert code == 200 and health.get("ok") is True, "API health check is not ready."

          payload = {
              "provider": "musicbrainz",
              "artist": "Daft Punk",
              "trackTitle": ""
          }
          for attempt in range(2):
              code, result = request(
                  base + "/api/catalog/search",
                  payload,
                  "https://btvrestored.ru",
              )
              if code == 429 and "Каталог занят" in str(result.get("error", "")) and attempt == 0:
                  time.sleep(1.5)
                  continue
              break

          print("CATALOG_STATUS:", code)
          print("CATALOG_OK:", result.get("ok"))
          print("CATALOG_PROVIDER:", result.get("provider"))
          print("CATALOG_RESULT_COUNT:", len(result.get("results", [])) if isinstance(result.get("results"), list) else "not-a-list")
          if code != 200 or result.get("ok") is not True:
              print("CATALOG_ERROR:", result.get("error", "unknown"))
          assert code == 200 and result.get("ok") is True, "Catalog endpoint failed."
          assert isinstance(result.get("results"), list) and len(result["results"]) > 0, "MusicBrainz returned no artist matches."
          print("SMOKE_TEST: PASS")
          PY
